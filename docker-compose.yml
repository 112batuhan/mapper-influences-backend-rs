version: '3'

services:
  # HACKY WAY TO GET VOLUME WORKING
  # DON'T DO IT IN PRODUCTION
  init-data:
    image: busybox
    command: chmod -R 777 /data
    volumes:
      - surrealdb-data:/data

  surrealdb:
    # Keep this in sync with the `surrealdb` crate and the test container tag
    image: surrealdb/surrealdb:v2.1.0
    entrypoint:
      - /surreal
      - start
      - --user
      - backend
      - --pass
      - password
      - --log
      - debug
      - rocksdb://data
    ports:
      - "8100:8000"
    networks:
      - mapper-influences-rs 
    volumes:
      - surrealdb-data:/data
    depends_on:
      init-data:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    # Cache only, so evict the least recently used keys instead of erroring out when full
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - mapper-influences-rs

  mapper_influences_backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - surrealdb
      - redis
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    ports:
      - "${PORT}:${PORT}"
    networks:
      - mapper-influences-rs 
    environment:
      SURREAL_USER: backend
      SURREAL_PASS: ${SURREAL_PASS:-password} 
      SURREAL_URL: ${SURREAL_URL:-ws://surrealdb:8000} 
      REDIS_URL: ${REDIS_URL:-redis://redis:6379} 
      REDIRECT_URI: http://localhost:8000/oauth/osu-redirect
      POST_LOGIN_REDIRECT_URI: http://localhost:3000/dashboard
      JWT_SECRET_KEY: localkey
      ADMIN_PASSWORD: localpass
      PORT: 8000
      CLIENT_ID: $CLIENT_ID
      CLIENT_SECRET: $CLIENT_SECRET

networks:
  mapper-influences-rs:

volumes:
  surrealdb-data:
